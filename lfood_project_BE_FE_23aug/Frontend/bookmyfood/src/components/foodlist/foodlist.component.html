<div class="container mb-5">
  <div class="row">
    @for (food of foodList; track $index) {
    <div class="col-md-3 mb-4">
      <div class="card h-100">
        <img src="{{ food.fimage }}" class="card-img-top" alt="Food Image" />
        <div class="card-body">
          <!-- Food ID Badge -->
          <span class="badge bg-primary mb-2">ID: {{ food.id }}</span>

          <h5 class="card-title">{{ food.fdname }}</h5>

          <p class="card-text mb-2">
            <strong>Category:</strong> {{ food.category }}
          </p>
          <p class="card-text mb-2">
            <strong>Price:</strong> Rs.{{ food.price }}
          </p>

          <!-- Quantity input -->
          <div class="quantity-box mb-3">
            <label class="form-label fw-semibold me-2">Quantity:</label>
            <input
              type="number"
              min="1"
              max="5"
              [(ngModel)]="foodquantity"
              (change)="changeFoodquantity(food.id!)"
              class="form-control form-control-sm d-inline-block w-50"
            />
          </div>

          <a class="btn btn-primary w-100" (click)="save(food.id!)">
            Order Now
          </a>
        </div>
      </div>
    </div>
    }
  </div>
</div>
