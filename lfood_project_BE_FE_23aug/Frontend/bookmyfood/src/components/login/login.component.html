<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
  <div class="row w-100 shadow-lg rounded-4 overflow-hidden login-wrapper">
  
    <div class="col-md-6 d-none d-md-flex flex-column justify-content-center align-items-center text-white p-5 left-side">
      <h1 class="fw-bold display-5">Place My Food 🍕</h1>
      <p class="lead mt-3">Fast • Fresh • Delivered</p>
      <img src="https://cdn-icons-png.flaticon.com/512/3075/3075977.png" alt="Food" class="img-fluid mt-4" style="max-height: 220px;">
    </div>

    <div class="col-md-6 bg-white p-5">
      <h3 class="text-center mb-4 fw-bold">Welcome Back 👋</h3>
      <form>
        <div class="form-floating mb-3">
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            placeholder="Enter email"
            [(ngModel)]="login.email"
          />
          <label for="email">Email address</label>
        </div>
        <div class="form-floating mb-3">
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="Enter password"
            [(ngModel)]="login.passWord"
          />
          <label for="password">Password</label>
        </div>
        <div class="d-flex justify-content-between mb-3">
          <div>
            <input type="checkbox" id="remember" />
            <label for="remember" class="small"> Remember me</label>
          </div>
          <a href="#" class="small text-decoration-none">Forgot Password?</a>
        </div>
        <button type="submit" class="btn btn-primary w-100" (click)="onLogin()">Login</button>
      </form>
      <p class="text-center mt-3 small">
        Don’t have an account?
        <a href="#" class="fw-bold text-decoration-none">Sign Up</a>
      </p>
    </div>
  </div>
</div>
