<div class="container-fluid auth-container">
  <div class="row min-vh-100">
    <!-- LEFT SIDE -->
    <div
      class="col-md-6 auth-left d-flex flex-column justify-content-center align-items-center text-white p-5"
    >
      <h1 class="fw-bold display-5 mb-3">E-Commerce Store</h1>
      <p class="lead">Join thousands of happy shoppers</p>
      <i class="fa-solid fa-cart-shopping fa-4x mt-4"></i>
      <p class="mt-5">
        Already have an account?
        <a [routerLink]="['/login']" class="text-white fw-bold underline-hover">
          Sign In
        </a>
      </p>
    </div>

    <!-- RIGHT SIDE -->
    <div
      class="col-md-6 d-flex justify-content-center align-items-center auth-right"
    >
      <div
        class="card form-card shadow-lg p-5 rounded-4 w-100"
        style="max-width: 420px"
      >
        <h3 class="text-center fw-bold mb-2">Create Account</h3>
        <p class="text-center text-muted mb-4">
          Fill in your details to get started
        </p>

        <form (ngSubmit)="onRegister()" #registerForm="ngForm">
          <div class="row">
            <div class="col-md-6 mb-3">
              <input
                type="text"
                class="form-control rounded-3"
                placeholder="First Name"
                [(ngModel)]="user.firstName"
                name="firstName"
                required
              />
            </div>
            <div class="col-md-6 mb-3">
              <input
                type="text"
                class="form-control rounded-3"
                placeholder="Last Name"
                [(ngModel)]="user.lastName"
                name="lastName"
                required
              />
            </div>
          </div>

          <div class="mb-3">
            <input
              type="text"
              class="form-control rounded-3"
              placeholder="User ID"
              [(ngModel)]="user.userId"
              name="userId"
              required
            />
          </div>

          <div class="mb-3">
            <input
              type="email"
              class="form-control rounded-3"
              placeholder="Email Address"
              [(ngModel)]="user.emailId"
              name="emailId"
              required
            />
          </div>

          <div class="mb-3">
            <input
              type="password"
              class="form-control rounded-3"
              placeholder="Password"
              [(ngModel)]="user.passWord"
              name="passWord"
              required
              minlength="6"
            />
          </div>

          <div class="mb-3">
            <input
              type="text"
              class="form-control rounded-3"
              placeholder="Address (Optional)"
              [(ngModel)]="user.address"
              name="address"
            />
          </div>

          <div class="mb-3">
            <input
              type="tel"
              class="form-control rounded-3"
              placeholder="Phone Number (Optional)"
              [(ngModel)]="user.phone"
              name="phone"
            />
          </div>

          <button
            type="submit"
            class="btn btn-primary w-100 py-2 mt-2 rounded-pill"
          >
            Create Account
          </button>
        </form>

        <p class="text-center mt-4 small text-muted">
          By creating an account, you agree to our
          <a href="#" class="auth-link fw-semibold">Terms of Service</a> and
          <a href="#" class="auth-link fw-semibold">Privacy Policy</a>
        </p>
      </div>
    </div>
  </div>
</div>
