<div class="container mt-5">
  <h3 class="text-center">Sign Up</h3>
  <form (ngSubmit)="onRegister()">
    <div class="mb-3">
      <label>First Name</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="user.firstName"
        name="firstName"
        required
      />
    </div>

    <div class="mb-3">
      <label>Last Name</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="user.lastName"
        name="lastName"
        required
      />
    </div>

    <div class="mb-3">
      <label>Username</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="user.userId"
        name="userId"
        required
      />
    </div>

    <div class="mb-3">
      <label>Email</label>
      <input
        type="email"
        class="form-control"
        [(ngModel)]="user.emailId"
        name="emailId"
        required
      />
    </div>

    <div class="mb-3">
      <label>Password</label>
      <input
        type="password"
        class="form-control"
        [(ngModel)]="user.passWord"
        name="passWord"
        required
      />
    </div>

    <div class="mb-3">
      <label>Address</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="user.address"
        name="address"
      />
    </div>

    <button type="submit" class="btn btn-primary w-100">Register</button>
  </form>
</div>
