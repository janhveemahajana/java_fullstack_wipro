<div class="admin-header">
  <h2>Admin - Manage Products</h2>
  <a href="#" class="logout-btn" (click)="logout(); $event.preventDefault()">
    🚪 Logout
  </a>
</div>

<div class="search-bar">
  <label for="category">Filter by Category:</label>
  <select [(ngModel)]="searchCategory" (ngModelChange)="filterProducts()">
    <option value="">All Categories</option>
    <option value="kitchen">Kitchen</option>
    <option value="electronics">Electronics</option>
    <option value="fashion">Fashion</option>
    <option value="footwear">Footwear</option>
  </select>
</div>

<button (click)="goToAdd()">+ Add Product</button>

<table border="1" width="100%">
  <tr>
    <th>Name</th>
    <th>Description</th>
    <th>Category</th>
    <th>Price</th>
    <th>Available</th>
    <th>Actions</th>
  </tr>
  <tr *ngFor="let product of filteredProducts">
    <td>{{ product.prodName }}</td>
    <td>{{ product.prodDesc }}</td>
    <td>{{ product.prodCat }}</td>
    <td>{{ product.price | currency : "INR" }}</td>
    <td>{{ product.availableQty }}</td>
    <td>
      <button (click)="goToEdit(product.id)">Edit</button>
      <button (click)="deleteProduct(product.id)">Delete</button>
    </td>
  </tr>
</table>

<div *ngIf="filteredProducts.length === 0">
  <p>No products found for this category.</p>
</div>
