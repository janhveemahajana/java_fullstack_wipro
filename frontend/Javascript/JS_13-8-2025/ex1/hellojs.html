<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    //Ex 1 :Create a hellojs.html. Inside script tag create a function to add
    two values. Call that function passing two values. Inside the function add
    (concatenate) two values and print it.
    
    <script>
      function add(a, b) {
        console.log(a + b);
      }
      add(3, 4); // 7
      add("Janhvee ", "Mahajan"); // Janhvee Mahajan
      add(true, false); // 1
      add(true, true); // 2
      add(false, false); // 0
      add(null, null); // 0
    </script>
  </body>
</html>
