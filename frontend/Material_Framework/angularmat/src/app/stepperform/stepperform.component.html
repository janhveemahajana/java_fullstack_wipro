<h1 class="mb">{{ title }}</h1>

<!-- Use the vertical stepper -->
<mat-vertical-stepper [linear]="true">
  <!-- Step 1: Name -->
  <mat-step [stepControl]="nameGroup" label="Name">
    <form [formGroup]="nameGroup">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Full Name</mat-label>
        <input matInput formControlName="name" placeholder="e.g. Janhvee Mahajan" />
        <mat-error *ngIf="nameGroup.get('name')?.hasError('required')">Name is required</mat-error>
        <mat-error *ngIf="nameGroup.get('name')?.hasError('minlength')">At least 2 characters</mat-error>
      </mat-form-field>
    </form>

    <div class="actions">
      <button mat-button matStepperNext [disabled]="nameGroup.invalid">Next</button>
    </div>
  </mat-step>

  <!-- Step 2: Age -->
  <mat-step [stepControl]="ageGroup" label="Age">
    <form [formGroup]="ageGroup">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Age</mat-label>
        <input matInput type="number" formControlName="age" placeholder="e.g. 22" />
        <mat-error *ngIf="ageGroup.get('age')?.hasError('required')">Age is required</mat-error>
        <mat-error *ngIf="ageGroup.get('age')?.hasError('min')">Must be at least 1</mat-error>
        <mat-error *ngIf="ageGroup.get('age')?.hasError('max')">Must be ≤ 120</mat-error>
      </mat-form-field>
    </form>

    <div class="actions">
      <button mat-button matStepperPrevious>Back</button>
      <button mat-button matStepperNext [disabled]="ageGroup.invalid">Next</button>
    </div>
  </mat-step>

  <!-- Step 3: Email -->
  <mat-step [stepControl]="emailGroup" label="Email">
    <form [formGroup]="emailGroup">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" placeholder="e.g. janhvee@example.com" />
        <mat-error *ngIf="emailGroup.get('email')?.hasError('required')">Email is required</mat-error>
        <mat-error *ngIf="emailGroup.get('email')?.hasError('email')">Enter a valid email</mat-error>
      </mat-form-field>
    </form>

    <div class="actions">
      <button mat-button matStepperPrevious>Back</button>
      <button mat-raised-button color="primary" (click)="submit()" [disabled]="emailGroup.invalid">
        Submit
      </button>
    </div>

    <!-- Quick summary (optional) -->
    <div class="summary">
      <p><strong>Name:</strong> {{ summary.name || '—' }}</p>
      <p><strong>Age:</strong> {{ summary.age || '—' }}</p>
      <p><strong>Email:</strong> {{ summary.email || '—' }}</p>
    </div>
  </mat-step>
</mat-vertical-stepper>
