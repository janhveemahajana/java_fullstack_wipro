<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
  </head>
  <body>

    <!-- Ex 6 -->
    <h2>Student Registration Form</h2>

    <label>Roll no. :</label>
    <input type="number" required /><br />
    <br />

    <label>Student Name :</label>
    <input type="text" placeholder="First Name" />-<input
      type="text"
      placeholder="Last Name"
      required
    /><br /><br />

    <label>Father's name :</label>
    <input type="text" required /><br /><br />

    <label>Date of birth :</label>
    <input type="date" placeholder="DD" required /> (DD/MM/YYYY)<br /><br />

    <label>Mobile no. :</label>
    <input
      type="tel"
      placeholder="10 digit mobile number"
      pattern="[0-9]{10}"
      required
    /><br /><br />

    <label>Email id :</label>
    <input type="email" />
    <br /><br />

    <label>Password :</label>
    <input type="password" minlength="8" required /><br /><br />

    <label>Gender :</label>
    <input type="radio" /> Male <input type="radio" /> Female

    <br /><br />

    <label>Department :</label>
    <input type="checkbox" /> CSE <input type="checkbox" /> IT
    <input type="checkbox" /> ECE <input type="checkbox" /> Civil
    <input type="checkbox" /> Mech

    <br /><br />
    <label>Course :</label>

    <select id="course" name="course">
      <option>--Please choose an option--</option>
      <option>B.Tech</option>
      <option>M.Tech</option>
      <option>MBA</option>
      <option>MCA</option>
    </select>

    <br /><br />
    <label>Student photo :</label>
    <input type="file" accept="image/*" required /><br /><br />

    <label>City :</label>
    <input type="text" required />
    <br /><br />
    <label>Address :</label>
    <textarea
      rows="4"
      cols="50"
      placeholder="Enter your address"
      required
    ></textarea>
    <br /><br />

    <button type="submit">Register</button>
  </body>
</html>
